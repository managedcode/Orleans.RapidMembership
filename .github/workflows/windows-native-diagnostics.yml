name: Windows native diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DCP_DIAGNOSTICS_LOG_FOLDER: ${{ github.workspace }}/artifacts/tests/dcp-diagnostics
  DCP_DIAGNOSTICS_LOG_LEVEL: info

jobs:
  diagnose:
    name: Native process evidence (${{ matrix.suite }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [provider, scale, aspire]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare Aspire CLI bundle
        run: |
          dnx --yes aspire.cli@13.6.1 -- setup --install-path "$env:USERPROFILE\.aspire"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.aspire\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Restore
        run: dotnet restore RapidCluster.slnx
      - name: Build
        run: dotnet build RapidCluster.slnx --no-restore --configuration Release -warnaserror
      - name: Execute and join native suite with live checkpoint uploads
        uses: ./eng/native-diagnostics
        with:
          suite: ${{ matrix.suite }}
      - name: Retain complete original diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.suite }}-original
          path: artifacts/tests/**
          if-no-files-found: error
