name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare Aspire CLI bundle
        run: |
          dnx --yes aspire.cli@13.6.1 -- setup --install-path "$HOME/.aspire"
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build RapidCluster.slnx --configuration Release -warnaserror
      - uses: github/codeql-action/analyze@v3
