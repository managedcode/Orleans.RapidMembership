name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  qualify:
    name: Build and qualify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare Aspire CLI bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          dnx --yes aspire.cli@13.6.1 -- setup --install-path "$HOME/.aspire"
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
      - name: Prepare Aspire CLI bundle (Windows)
        if: runner.os == 'Windows'
        run: |
          dnx --yes aspire.cli@13.6.1 -- setup --install-path "$env:USERPROFILE\.aspire"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.aspire\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore
        run: dotnet restore RapidCluster.slnx
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format RapidCluster.slnx --no-restore --exclude src/Clockwork --verify-no-changes
      - name: Build
        run: dotnet build RapidCluster.slnx --no-restore --configuration Release -warnaserror
      - name: Membership, persistence, network and Orleans Aspire tests
        run: dotnet run --project tests/ManagedCode.Orleans.RapidMembership.Tests --configuration Release --no-build -- --filter-not-trait Category=Scale --timeout 600s --output Detailed --coverage --coverage-settings eng/coverage.config.xml --coverage-output-format cobertura --coverage-output membership.cobertura.xml --report-trx --results-directory artifacts/tests/membership
      - name: Enforce provider coverage
        run: python eng/verify-coverage.py artifacts/tests/membership/membership.cobertura.xml
      - name: RAPID unit tests
        run: dotnet run --project tests/RapidCluster.Unit.Tests --configuration Release --no-build -- --timeout 600s --output Detailed --coverage --coverage-settings eng/coverage.config.xml --coverage-output-format cobertura --coverage-output unit.cobertura.xml --report-trx --results-directory artifacts/tests/unit
      - name: RAPID real networking tests
        run: dotnet run --project tests/RapidCluster.Integration.Tests --configuration Release --no-build -- --timeout 600s --output Detailed --coverage --coverage-settings eng/coverage.config.xml --coverage-output-format cobertura --coverage-output network.cobertura.xml --report-trx --results-directory artifacts/tests/network
      - name: RAPID deterministic simulation tests
        run: python eng/test-simulations.py --workers 2
      - name: RAPID Aspire tests
        run: dotnet run --project tests/RapidCluster.EndToEnd/RapidCluster.EndToEnd.Tests --configuration Release --no-build -- --timeout 600s --output Detailed --report-trx --results-directory artifacts/tests/rapid-aspire
      - name: Pack RAPID protocol
        run: dotnet pack src/RapidCluster.Core --configuration Release --no-build --output artifacts/packages -warnaserror
      - name: Pack gRPC transport
        run: dotnet pack src/RapidCluster.Grpc --configuration Release --no-build --output artifacts/packages -warnaserror
      - name: Pack Orleans provider
        run: dotnet pack src/ManagedCode.Orleans.RapidMembership --configuration Release --no-build --output artifacts/packages -warnaserror
      - name: Retain original verification artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-${{ matrix.os }}
          path: |
            artifacts/tests/**
            artifacts/packages/*.nupkg
          if-no-files-found: warn

  scale:
    name: Real Orleans 0-to-50 silo churn (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare Aspire CLI bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          dnx --yes aspire.cli@13.6.1 -- setup --install-path "$HOME/.aspire"
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
      - name: Prepare Aspire CLI bundle (Windows)
        if: runner.os == 'Windows'
        run: |
          dnx --yes aspire.cli@13.6.1 -- setup --install-path "$env:USERPROFILE\.aspire"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.aspire\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Restore
        run: dotnet restore RapidCluster.slnx
      - name: Build
        run: dotnet build tests/ManagedCode.Orleans.RapidMembership.Tests --no-restore --configuration Release -warnaserror
      - name: Continuous clients, concurrent joins and departures, total loss and restart
        run: dotnet run --project tests/ManagedCode.Orleans.RapidMembership.Tests --configuration Release --no-build -- --filter-trait Category=Scale --timeout 4500s --output Detailed --report-trx --results-directory artifacts/tests/churn
      - name: Retain original scale qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-scale-linux
          path: artifacts/tests/**
          if-no-files-found: error
